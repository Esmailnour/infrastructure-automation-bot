name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q src main.py

      - name: Test
        run: pytest -q

      - name: Basic committed-secret guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE             --exclude-dir=.git             --exclude='*.xlsx'             --exclude='ci.yml'             '(TELEGRAM_BOT_TOKEN=[^r]|[0-9]{6,12}:[A-Za-z0-9_-]{25,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' .; then
            echo "Potential committed secret detected."
            exit 1
          fi
