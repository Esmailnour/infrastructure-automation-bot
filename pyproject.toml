[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-automation-bot"
version = "1.0.0"
description = "Portfolio-safe infrastructure automation and server-management Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "asyncssh>=2.20,<3",
  "requests>=2.32,<3",
  "python-telegram-bot>=22,<23",
  "watchdog>=6,<7",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
infra-bot = "infra_bot.telegram_app:run_bot"
infra-bot-demo = "infra_bot.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
